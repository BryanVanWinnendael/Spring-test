name: AI Code Review

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  ai-review:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install -r scripts/requirements.txt

      - name: Get Java PR diff
        run: |
          git diff \
            origin/${{ github.base_ref }}...HEAD \
            -- '*.java' \
            > pr.diff

      - name: AI review
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/ai-review.py pr.diff